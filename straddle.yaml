# hw-station-g2 — board HAL straddle for the B&Q Station G2.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-station-g2` and inherits the
# board's pin map, bring-up hooks and hardware kconfig.
#
# Owns the Station G2 board HAL (esp-idf/src/stationg2.cpp: the LoRa CS park,
# the program-button pull and sys.board) + the optional GROVE GNSS receiver
# (gps.cpp). app_main, partitions, the OTA story and the browser SPA are NOT
# here — they belong to the buildable. Board reference:
# https://wiki.bqvoy.com/en/meshtastic/station-g2
#
# The G2 is a high-power base-station node (DISCONTINUED, but fielded):
# ESP32-S3 with 16 MB flash, 8 MB octal PSRAM and native USB, one SX1262 on
# its own SPI bus, and an ALWAYS-IN-PATH RF front end — a 35 dBm-P1dB TX PA
# plus an 18.5 dB RX LNA — with NO firmware control pins (declared, not
# detected: see the FEM lines in the kconfig group below). The 1.3" SH1107
# OLED stays dark until spangap/tinylcd grows SH1107 support (see the
# commented-out additional_installs). No battery, no SD card, no Vext-style
# firmware-gated rail.
schema_version: 1
name: spangap/hw-station-g2
prefix: stationg2
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# Board bring-up as registered Services. app_main is generated by the buildable;
# it constructs these in listed order and walks them (onStart before spangapInit,
# onInit after). ORDER MATTERS:
#   StationG2Board.onStart — bare-hardware LoRa CS park + program-button pull;
#     runs before spangapInit(). Its onInit publishes sys.board, which needs
#     storage and so cannot happen in the start band.
#   GpsService.onInit — GNSS task for the optional GROVE module; needs the
#     platform up. Listed after the board so sys.board is published before
#     anything reads it.
# No #if anywhere.
services:
  - { class: StationG2Board, header: stationg2.h }
  - { class: GpsService,     header: gps.h }
# The board's screen is a 1.3" SH1107 mono OLED — exactly the class of panel
# tinylcd's paged status UI exists for, and this board would stage it here the
# way the Heltec V4 / T3-S3 stage theirs. Deliberately COMMENTED OUT for now,
# two blockers:
#   1. github.com/spangap/tinylcd is not published yet — a live entry here
#      would make every `spangap build --with` of this board try to clone it
#      and fail the build.
#   2. tinylcd's controller support today is SSD1306-default, and the SH1107
#      is NOT an SSD1306 (different controller and addressing) — it needs a
#      controller-select knob that must exist tinylcd-side before pins help.
# Uncomment when both land; the when:-gated TINYLCD pin group below is already
# in place and harmless until then. (Same commented-out-with-reasons pattern
# reticulous/straddle.yaml uses for rlpg.)
# additional_installs:
#   - spangap/tinylcd
# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: 16 MB QIO flash @ 80 MHz, 8 MB *octal* PSRAM (board.json
  # memory_type qio_opi). The platform's usual octal-PSRAM assumption holds on
  # this board (unlike the quad-PSRAM Heltec V4 / T3-S3), so SPIRAM_MODE_OCT.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  # State floor = the offset where the runtime read-write /state partition
  # begins; /state then fills the rest of the real 16 MB chip. WITHOUT this the
  # floor defaults to the whole flash container, so `app` expands to fill all
  # 16 MB and NO /state partition exists (the device has nowhere to store user
  # data). 6 MB = the headless app+fixed (~2.8 MB) plus ~3 MB of growth
  # headroom; /state gets the remaining ~10 MB. There is no SD card on the G2,
  # so /state is all the storage the node has — and ~10 MB of it, on a
  # mains-powered high-power node, makes this board a natural LXMF
  # propagation/mailbox host (`--with reticulous/rlpg`). Changing this
  # relocates /state → existing devices factory-reset on the next boot, so
  # warn users before bumping it.
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=6144
  - CONFIG_SPIRAM_MODE_OCT=y
  # One SX1262 LoRa modem on its own SPI bus (separate from the flash bus).
  # Pins per Meshtastic's station-g2 variant (station_common.h — shared
  # verbatim with the Station G3, see the README's G3 caveat). The SX1262
  # drives DIO2 as the RF switch of the front end and DIO3 supplies the 1.8 V
  # TCXO (32 MHz ±1.5 ppm KDS DSB211SDN). Gated on iface-lora: the
  # CONFIG_LORA_* symbols are DEFINED by that straddle's Kconfig, so applying
  # these in a build without it would warn as unknown symbols. Wire them only
  # when the LoRa straddle is actually staged.
  - when: reticulous/iface-lora
    set:
      - CONFIG_LORA_COUNT=1
      - CONFIG_LORA_SPI_HOST=2
      - CONFIG_LORA_SCK_PIN=12
      - CONFIG_LORA_MOSI_PIN=13
      - CONFIG_LORA_MISO_PIN=14
      - CONFIG_LORA0_CS_PIN=11
      - CONFIG_LORA0_DIO1_PIN=48
      - CONFIG_LORA0_BUSY_PIN=47
      - CONFIG_LORA0_RST_PIN=21
      - CONFIG_LORA0_TCXO_MV=1800
      - CONFIG_LORA0_DIO2_RF_SWITCH=y
      - CONFIG_LORA0_RADIO_SX1262=y
      # RF front end — DECLARED, not detected. The G2 puts an always-in-path
      # FEM between the SX1262 and the antenna: a 35 dBm-P1dB TX PA (on its
      # own 7.5 V rail) + an 18.5 dB ultra-low-NF RX LNA + an RF switch driven
      # by the SX1262's own DIO2. NO control pins and NO detect pins reach the
      # MCU — the Heltec-style FEM_EN/TXSEL/detect dance has nothing to talk
      # to — so the board states the FEM as fact through iface-lora's
      # fixed-FEM support (sibling patch, iface-lora branch station-g2-fem;
      # until it is upstreamed, MAINLINE iface-lora warns the two FEM_FIXED
      # symbols below as unknown and converts nothing — do not trust
      # high-power settings on mainline). The numbers come from B&Q's PA
      # conduction test (chip dBm → antenna dBm, US915/EU868):
      #   * FEM_FIXED_GAIN_DB=20 — the measured EU-mid-table gain, chosen so a
      #     requested "35 at the antenna" maps to chip 15 = the EU-band P1dB
      #     point and B&Q's recommended EU setting (chip 15 → 35.0 EU /
      #     34.5 US at the antenna).
      #   * FEM_MAX_CHIP_DBM=16 — the US-band P1dB. femChipDbm's walk never
      #     drives the chip past this, even if a build overrides the gain, so
      #     the PA stays inside its linear region. (Meshtastic caps the chip
      #     at SX126X_MAX_POWER 19 = the absolute-max row, already
      #     compressing; we stop 3 dB earlier on purpose.)
      #   * LORA_TX_POWER_MAX=35 — the ceiling at the antenna = P1dB, NOT the
      #     37 dBm saturation figure the conduction table tops out at.
      # POWER truth: the PA's 7.5 V rail is only live on USB-PD 15 V or
      # 9-19 V DC input (LEDs: LV red = 3.3 V logic, HV green = 7.5 V rail,
      # PA blue = amplifying). On plain USB the PA is unpowered and the node
      # radiates at chip power minus the PA-path losses — the firmware cannot
      # see the difference.
      # REGULATORY truth: EU868 law caps far below this hardware — 14 dBm ERP
      # in most subbands, 27 dBm ERP + 10% duty only in 869.4-869.65 MHz. The
      # SUPE regime channels self-cap at 14 dBm regardless of this ceiling
      # (EN 300 220's figure, see iface-lora's supe.cpp); the hailing channel
      # is the operator's to set. Per platform philosophy s.lora.0.tx_power
      # ships with NO default — the user must choose, and the radio refuses
      # to start until it is set.
      - CONFIG_LORA0_FEM_FIXED_GAIN_DB=20
      - CONFIG_LORA0_FEM_MAX_CHIP_DBM=16
      - CONFIG_LORA_TX_POWER_MAX=35
  # 1.3" SH1107 128x64 OLED on I2C (SDA 5 / SCL 6 — the bus also feeds the
  # GROVE I2C and QWIIC sockets), addresses 0x3C/0x3D. No OLED reset line on
  # the G2 — the T3-S3 shows omitting TINYLCD_RST_PIN is fine. The page button
  # is the program button (GPIO 38), which needs the INTERNAL pullup (no
  # external pull on this board) — the board's onStart arms the pull in case
  # tinylcd doesn't. SH1107 controller select is still pending tinylcd-side
  # support (see the commented-out additional_installs above). Gated: without
  # tinylcd staged these symbols don't exist — harmless while tinylcd is not
  # staged, ready for the day it is.
  - when: spangap/tinylcd
    set:
      - CONFIG_TINYLCD_SDA_PIN=5
      - CONFIG_TINYLCD_SCL_PIN=6
      - CONFIG_TINYLCD_BUTTON_PIN=38
# Declarative settings: the board's rows on the System page. What this board
# offers is device-wide, not a program, so it lands on System rather than in a
# menu of its own; order 10 puts Hardware at the top, ahead of the unordered
# blocks the platform straddles contribute there, and order 30 keeps GPS below
# where a screen board's Display section (order 20) would sit — nothing at 20
# here until tinylcd lands. gps.* rows are defaultless: those defaults are
# owned by gps.cpp; this block only surfaces the keys.
settings:
  - at: [ { id: system } ]
    order: 10
    rows:
      - section: "Hardware"
      - info:
          rows:
            - value: { label: "Board", key: "sys.board" }
            - value: { label: "GPS",   key: "gps.model" }
  - at: [ { id: system } ]
    order: 30
    rows:
      - section: "GPS"
      - switch: { label: "Enable",       key: "s.gps.enable" }
      - slider: { label: "Interval (s)", key: "s.gps.interval", min: 0, max: 10 }
      - value:  { label: "Status",       key: "gps.state" }
